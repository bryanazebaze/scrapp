# Alembic configuration for CentralImmo.
# The database URL is read from core.config.settings (env-driven) inside
# alembic/env.py, so this placeholder here is only a fallback.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://immo_user:1234@localhost/immo_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S