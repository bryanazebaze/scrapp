name: centralimmo
description: "CentralImmo — Plateforme d'agrégation et d'intelligence immobilière du Cameroun"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  geolocator: ^14.0.2

  # Audio (ElevenLabs voice mode)
  audioplayers: ^6.0.0

  # Speech-to-text (on-device voice input)
  speech_to_text: ^7.4.0

  # Localization
  flutter_localizations:
    sdk: flutter
  lottie: ^3.3.3

  # Auth & Payments
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.2.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/animations/