name: immo_app
description: "CentralImmo — Plateforme d'agrégation et d'intelligence immobilière du Cameroun"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/